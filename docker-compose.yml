services:
  brainless-dash:
    image: brainless86/brainless-dash:latest
    container_name: brainless-dash
    restart: unless-stopped
    # Host network gives accurate per-interface bandwidth on the host NICs.
    # If you prefer bridged networking, comment network_mode and add:
    #   ports:
    #     - "8080:8080"
    network_mode: host
    pid: host
    # Read-only mounts so the container can read host metrics without write access.
    volumes:
      - /sys:/sys:ro
      - /proc:/proc:ro
      - /mnt:/mnt:ro
    environment:
      - TZ=Australia/Sydney
      - PORT=8090
      - REFRESH_MS=2000
      - LOG_LEVEL=info
      - PLEX_URL=http://localhost:32400
      - PLEX_TOKEN=
      - SONARR_URL=http://localhost:8989
      - SONARR_API_KEY=
      - SABNZBD_URL=http://localhost:8080
      - SABNZBD_API_KEY=
      - QB_URL=http://localhost:8080
      - QB_USERNAME=admin
      - QB_PASSWORD=
      - QB_API_KEY=
      - MC_HOST=
      - MC_PORT=25565
      - MC_RCON_PORT=25575
      - MC_RCON_PASSWORD=
      - HTTPS_CERT=
      - HTTPS_KEY=
