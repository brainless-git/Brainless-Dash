<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Brainless-Dash">
  <defs>
    <linearGradient id="fg" x1="0" y1="1" x2="0" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#FFE000"/>
      <stop offset="45%"  stop-color="#FF6600"/>
      <stop offset="100%" stop-color="#CC1100"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" fill="#000"/>

  <!-- Crossbones -->
  <line x1="10" y1="22" x2="54" y2="50" stroke="#F5A800" stroke-width="5" stroke-linecap="round"/>
  <circle cx="9"  cy="20" r="5" fill="#F5A800"/>
  <circle cx="55" cy="52" r="5" fill="#F5A800"/>
  <line x1="54" y1="22" x2="10" y2="50" stroke="#F5A800" stroke-width="5" stroke-linecap="round"/>
  <circle cx="55" cy="20" r="5" fill="#F5A800"/>
  <circle cx="9"  cy="52" r="5" fill="#F5A800"/>

  <!-- Skull -->
  <circle cx="32" cy="40" r="16" fill="#000" stroke="#F5A800" stroke-width="2.5"/>
  <rect x="23" y="24" width="18" height="10" fill="#000"/>
  <line x1="23" y1="24" x2="23" y2="34" stroke="#F5A800" stroke-width="2.5"/>
  <line x1="41" y1="24" x2="41" y2="34" stroke="#F5A800" stroke-width="2.5"/>
  <ellipse cx="32" cy="24" rx="9" ry="4" fill="#111" stroke="#F5A800" stroke-width="2.5"/>
  <!-- Eyes -->
  <circle cx="27" cy="39" r="5" fill="#F5A800"/>
  <circle cx="37" cy="39" r="5" fill="#F5A800"/>
  <!-- Nose -->
  <polygon points="32,44 29,50 35,50" fill="#F5A800"/>
  <!-- Teeth -->
  <line x1="26" y1="54" x2="38" y2="54" stroke="#F5A800" stroke-width="2"/>
  <rect x="27" y="54" width="4" height="5" rx="1" fill="#F5A800"/>
  <rect x="34" y="54" width="4" height="5" rx="1" fill="#F5A800"/>

  <!-- Flames -->
  <path d="M26,24 C24,20 21,17 23,12 C20,15 18,13 19,8 C22,13 23,10 24,6 C25,11 24,15 26,13 C25,17 26,22 26,24Z" fill="url(#fg)"/>
  <path d="M32,24 C30,18 26,14 28,8 C26,13 23,11 25,5 C28,11 31,8 32,3 C33,8 36,11 39,5 C41,11 38,13 36,8 C38,14 34,18 32,24Z" fill="url(#fg)"/>
  <path d="M38,24 C38,22 39,17 38,13 C40,15 39,11 40,6 C41,10 42,13 44,8 C46,13 43,15 41,12 C43,17 40,20 38,24Z" fill="url(#fg)"/>
</svg>
