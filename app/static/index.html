<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1c">
<title>Brainless-Dash</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 100 110" aria-hidden="true">
      <path d="M 0 50 C 0 -5, 100 -5, 100 50 L 100 100 C 94 110, 84 105, 78 95 C 71 108, 58 108, 52 95 C 45 108, 32 108, 26 95 C 20 105, 6 110, 0 100 Z" fill="#e22828"/>
      <ellipse cx="32" cy="56" rx="9" ry="13" fill="#ffffff"/>
      <ellipse cx="70" cy="56" rx="9" ry="13" fill="#ffffff"/>
      <circle cx="35" cy="60" r="4" fill="#1c1c1c"/>
      <circle cx="73" cy="60" r="4" fill="#1c1c1c"/>
      <circle cx="36" cy="57" r="1.4" fill="#ffffff"/>
      <circle cx="74" cy="57" r="1.4" fill="#ffffff"/>
    </svg>
    <span class="brand-name">BRAINLESS<span class="brand-accent">-DASH</span></span>
  </div>
  <div class="status">
    <span id="status-dot" class="dot dot-off"></span>
    <span id="hostname">connecting</span>
  </div>
</header>

<main class="content">

  <section class="card" id="card-system">
    <div class="card-head">
      <h2>System</h2>
      <span class="meta" id="uptime">,</span>
    </div>
    <div class="kv-grid">
      <div class="kv"><span class="k">Load 1m</span><span class="v" id="load1">,</span></div>
      <div class="kv"><span class="k">Load 5m</span><span class="v" id="load5">,</span></div>
      <div class="kv"><span class="k">Load 15m</span><span class="v" id="load15">,</span></div>
      <div class="kv"><span class="k">Cores</span><span class="v" id="cores">,</span></div>
    </div>
  </section>

  <section class="card" id="card-resources">
    <div class="card-head">
      <h2>CPU &amp; Memory</h2>
      <span class="meta" id="resource-meta">—</span>
    </div>
    <div class="resource-section">
      <div class="resource-label">
        <span class="resource-name">CPU</span>
        <span class="resource-value"><span id="cpu-percent">0</span>% <span class="meta-dim" id="cpu-freq"></span></span>
      </div>
      <div class="bar"><div class="bar-fill" id="cpu-bar"></div></div>
    </div>
    <div class="resource-section">
      <div class="resource-label">
        <span class="resource-name">Memory</span>
        <span class="resource-value"><span id="mem-used">—</span> / <span id="mem-total">—</span></span>
      </div>
      <div class="bar"><div class="bar-fill" id="mem-bar"></div></div>
    </div>
    <div class="kv-row">
      <div class="kv"><span class="k">Available</span><span class="v" id="mem-available">—</span></div>
      <div class="kv"><span class="k">Swap</span><span class="v" id="swap">—</span></div>
    </div>
  </section>

  <section class="card" id="card-temps">
    <div class="card-head">
      <h2>Temperatures</h2>
      <span class="meta" id="temp-count">—</span>
    </div>
    <canvas id="temp-canvas" height="140"></canvas>
    <div class="temp-legend" id="temp-legend">
      <div class="empty">Reading sensors…</div>
    </div>
  </section>

  <section class="card" id="card-storage">
    <div class="card-head">
      <h2>Storage</h2>
      <span class="meta" id="storage-summary">,</span>
    </div>
    <div class="disk-list" id="disk-list">
      <div class="empty">Scanning mounts,</div>
    </div>
  </section>

  <section class="card" id="card-sonarr" style="display:none">
    <div class="card-head">
      <h2>Sonarr</h2>
      <span class="meta" id="sonarr-count">—</span>
    </div>
    <div class="sonarr-list" id="sonarr-list">
      <div class="empty">no upcoming episodes</div>
    </div>
  </section>

  <section class="card" id="card-plex" style="display:none">
    <div class="card-head">
      <h2>Plex</h2>
      <span class="meta" id="plex-count"></span>
    </div>
    <div class="plex-streams" id="plex-streams">
      <div class="empty">no active streams</div>
    </div>
  </section>

  <section class="card" id="card-network">
    <div class="card-head">
      <h2>Network</h2>
      <span class="meta" id="net-iface-count">,</span>
    </div>
    <div class="net-rates">
      <div class="rate">
        <div class="rate-label">↓ Down</div>
        <div class="rate-value" id="net-down">0 B/s</div>
      </div>
      <div class="rate">
        <div class="rate-label">↑ Up</div>
        <div class="rate-value" id="net-up">0 B/s</div>
      </div>
    </div>
    <div class="iface-list" id="iface-list"></div>
  </section>

</main>

<footer class="footer">
  <span>refresh <span id="refresh-rate">2s</span></span>
  <span>•</span>
  <span id="last-update">—</span>
</footer>

<script src="/app.js"></script>
</body>
</html>
