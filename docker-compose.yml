services:
  brainless-dash:
    image: brainless86/brainless-dash:latest
    container_name: brainless-dash
    restart: unless-stopped
    # Host network gives accurate per-interface bandwidth on the host NICs.
    # If you prefer bridged networking, comment network_mode and add:
    #   ports:
    #     - "8090:8090"
    #     - "8180:8180"   # ACME HTTP-01 challenge port (forward port 80 here)
    network_mode: host
    # Read-only mounts for host metrics; rw mount for ACME cert storage.
    volumes:
      - /sys:/sys:ro
      - /proc:/proc:ro
      - /mnt:/mnt:ro
      - /mnt/user/appdata/brainless-dash/certs:/data/certs
    environment:
      - TZ=Australia/Sydney
      - PORT=8090
      - REFRESH_MS=2000
      - LOG_LEVEL=info
      - PLEX_URL=http://localhost:32400
      - PLEX_TOKEN=
      - SONARR_URL=http://localhost:8989
      - SONARR_API_KEY=
      - SABNZBD_URL=http://localhost:8080
      - SABNZBD_API_KEY=
      - QB_URL=http://localhost:8080
      - QB_USERNAME=admin
      - QB_PASSWORD=
      - QB_API_KEY=
      - MC_HOST=
      - MC_PORT=25565
      # Mount the Minecraft server's data directory read-only to enable
      # ops list, gamemode display, and on-disk mod count fallback.
      #   volumes:
      #     - /mnt/user/appdata/minecraft:/mnt/mc:ro
      - MC_DATA_DIR=
      # RCON enables the Op / Deop buttons in the Minecraft drill-down view.
      # Set enable-rcon=true and rcon.password in your server.properties first.
      - MC_RCON_PORT=25575
      - MC_RCON_PASSWORD=
      # Manual cert paths (skip if using ACME_DOMAIN below)
      - HTTPS_CERT=
      - HTTPS_KEY=
      # Automatic Let's Encrypt — set ACME_DOMAIN + ACME_EMAIL to enable.
      # DNS-01 challenge (recommended — no port forwarding needed):
      #   Set ACME_DNS_PLUGIN to: cloudflare | digitalocean | duckdns
      #   Set ACME_DNS_CREDENTIALS to the path of your credentials file inside the container.
      #   Mount the credentials file: - /path/to/cloudflare.ini:/data/certs/cloudflare.ini:ro
      # HTTP-01 challenge (fallback): forward port 80 on your router to host:ACME_CHALLENGE_PORT.
      - ACME_DOMAIN=
      - ACME_EMAIL=
      - ACME_DNS_PLUGIN=
      - ACME_DNS_CREDENTIALS=
      - ACME_CHALLENGE_PORT=8180
      # ── Tailscale ──────────────────────────────────────────────────────────────
      # Option A: Read status from the host's existing Tailscale installation.
      #   Mount the host socket (read-only) to show a status card in the dashboard.
      #   volumes:
      #     - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro
      - TAILSCALE_SOCKET=/var/run/tailscale/tailscaled.sock
      # Option B: Embedded Tailscale — container joins Tailscale as its own node
      #   and publishes the dashboard via `tailscale serve` (HTTPS at https://<hostname>.ts.net).
      #   Requires MagicDNS + HTTPS enabled in https://login.tailscale.com/admin/dns.
      #   Persist state so the node reconnects without re-auth on restart:
      #   volumes:
      #     - /mnt/user/appdata/brainless-dash/tailscale:/data/tailscale
      - TAILSCALE_AUTHKEY=
      - TAILSCALE_HOSTNAME=brainless-dash
      - TAILSCALE_STATE_DIR=/data/tailscale
